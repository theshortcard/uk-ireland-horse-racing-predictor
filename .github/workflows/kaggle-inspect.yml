name: Inspect Kaggle historical archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out predictor
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade kaggle six

      - name: Download and inspect archive structure
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KAGGLE_USERNAME}" ] || [ -z "${KAGGLE_KEY}" ]; then
            echo "::error::Add KAGGLE_USERNAME and KAGGLE_KEY as repository Actions secrets first."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/kaggle"
          mkdir -p "$HOME/.kaggle"
          printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > "$HOME/.kaggle/kaggle.json"
          chmod 600 "$HOME/.kaggle/kaggle.json"

          kaggle datasets metadata -d deltaromeo/horse-racing-results-ukireland-2015-2025 -p "$RUNNER_TEMP/kaggle" || true
          kaggle datasets download -d deltaromeo/horse-racing-results-ukireland-2015-2025 -p "$RUNNER_TEMP/kaggle" --unzip

          echo "=== Downloaded file inventory (raw data is not uploaded or committed) ==="
          find "$RUNNER_TEMP/kaggle" -type f -printf '%P | %s bytes\n' | sort

          python scripts/audit_kaggle_archive.py "$RUNNER_TEMP/kaggle"

          echo "=== Conservative GB/IRE staging counts (temporary output only) ==="
          mapfile -t SOURCE_CSVS < <(find "$RUNNER_TEMP/kaggle" -type f -name '*.csv' | sort)
          IMPORT_ARGS=()
          for source_csv in "${SOURCE_CSVS[@]}"; do
            IMPORT_ARGS+=(--input "$source_csv")
          done
          python -m src.import_kaggle_results "${IMPORT_ARGS[@]}" --output "$RUNNER_TEMP/kaggle/staging.csv"
          echo "=== Diagnostic validation of staged UK/IRE records ==="
          python -m src.validate_staged_results --input "$RUNNER_TEMP/kaggle/staging.csv" --output "$RUNNER_TEMP/kaggle/staging-audit.json"
          echo "=== Research-only preparation and quarantine counts ==="
          python -m src.prepare_historical_data --input "$RUNNER_TEMP/kaggle/staging.csv" --prepared "$RUNNER_TEMP/kaggle/research-only.csv" --quarantine "$RUNNER_TEMP/kaggle/quarantine.csv"
          echo "=== Race-level winner integrity audit (diagnostic only) ==="
          python -m src.audit_race_integrity --input "$RUNNER_TEMP/kaggle/research-only.csv" --output "$RUNNER_TEMP/kaggle/race-integrity-audit.json"
          rm -f "$RUNNER_TEMP/kaggle/staging.csv" "$RUNNER_TEMP/kaggle/staging-audit.json"

          rm -f "$HOME/.kaggle/kaggle.json"
