name: Predictor tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Generate sample report
        run: python -m src.run --input data/sample_racecard.csv --output reports/daily_report.md
      - name: Generate sample backtest
        run: python -m src.backtest --input data/sample_historical.csv --output reports/backtest.md
      - name: Upload sample reports
        uses: actions/upload-artifact@v5
        with:
          name: sample-predictor-reports
          path: |
            reports/daily_report.md
            reports/backtest.md
