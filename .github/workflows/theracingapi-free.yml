name: The Racing API free racecard test

on:
  workflow_dispatch:
    inputs:
      day:
        description: Racecard date to fetch
        required: true
        type: choice
        options:
          - today
          - tomorrow
        default: today

jobs:
  fetch-free-racecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch one free-tier racecard snapshot
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: |
          python -m src.fetch_racecards_api --day "${{ inputs.day }}" --output-dir data/external/theracingapi
      - name: Audit the saved racecard snapshot
        run: |
          snapshot="$(find data/external/theracingapi -maxdepth 1 -type f -name 'racecards_*.json' ! -name '*.meta.json' | sort | tail -n 1)"
          test -n "$snapshot"
          python -m src.audit_free_racecard "$snapshot" --output "reports/free-racecard-audit-${{ inputs.day }}.json"
          echo "SNAPSHOT=$snapshot" >> "$GITHUB_ENV"
          echo "METADATA=${snapshot%.json}.meta.json" >> "$GITHUB_ENV"
      - name: Convert declared runners to predictor CSV
        run: |
          python -m src.import_theracingapi_racecards \
            --snapshot "$SNAPSHOT" \
            --metadata "$METADATA" \
            --output "reports/free-racecard-${{ inputs.day }}.csv"
      - name: Generate experimental baseline prediction report
        run: |
          python -m src.run \
            --input "reports/free-racecard-${{ inputs.day }}.csv" \
            --output "reports/free-racecard-predictions-${{ inputs.day }}.md" \
            --allow-validation-warnings
      - name: Upload snapshot, audit, and prediction report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: theracingapi-free-racecard-${{ inputs.day }}
          path: |
            data/external/theracingapi/*
            reports/free-racecard-audit-${{ inputs.day }}.json
            reports/free-racecard-${{ inputs.day }}.csv
            reports/free-racecard-predictions-${{ inputs.day }}.md
          if-no-files-found: error
          retention-days: 1
